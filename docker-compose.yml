version: '3.8'

services:
  db:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_USER: stockmind
      POSTGRES_PASSWORD: stockmindpassword
      POSTGRES_DB: stockmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
