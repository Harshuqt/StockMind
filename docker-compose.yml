version: '3.8'

services:
  db:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_USER: stockmind
      POSTGRES_PASSWORD: stockmindpassword
      POSTGRES_DB: stockmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override the DB URL to point to the docker-compose 'db' service instead of localhost
      - DATABASE_URL=postgresql+asyncpg://stockmind:stockmindpassword@db:5432/stockmind_db
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
